[theme]
# Tema escuro sóbrio: azul como cor de interface; verde, amarelo e vermelho ficam reservados ao risco.
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c2e"
textColor = "#e2e8f0"
linkColor = "#60a5fa"
borderColor = "#1e293b"
dataframeBorderColor = "#1e293b"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"
headingFontSizes = ["2.0rem", "1.4rem", "1.15rem"]
metricValueFontSize = "1.9rem"
chartCategoricalColors = ["#6366f1", "#0ea5e9", "#a855f7", "#14b8a6", "#ec4899", "#64748b"]

[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#131c2e"
borderColor = "#1e293b"

[browser]
gatherUsageStats = false
